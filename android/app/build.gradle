plugins {
    id 'com.android.application'
}

// Release signing: the keystore never lives in the repository. Pass it only through the environment:
//   TASHBETZON_KEYSTORE=/path/to/tashbetzon-release.jks  TASHBETZON_KEYSTORE_PASSWORD=...  gradle assembleRelease
// (optional: TASHBETZON_KEY_ALIAS, default "tashbetzon"; TASHBETZON_KEY_PASSWORD, default = store password)
def releaseKeystore = System.getenv('TASHBETZON_KEYSTORE')

android {
    namespace 'app.tashbetzon'
    compileSdk 35

    defaultConfig {
        applicationId 'app.tashbetzon'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '0.2.1'
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('TASHBETZON_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TASHBETZON_KEY_ALIAS') ?: 'tashbetzon'
                keyPassword System.getenv('TASHBETZON_KEY_PASSWORD') ?: System.getenv('TASHBETZON_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Without a keystore the release APK is left unsigned (and cannot be installed) rather than debug-signed.
            signingConfig releaseKeystore ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The web app (../../app) is copied here at build time and served from assets/www.
            assets.srcDir(layout.buildDirectory.dir('generated/webassets'))
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "tashbetzon-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

def copyWebApp = tasks.register('copyWebApp', Sync) {
    from(rootProject.file('../app'))
    into(layout.buildDirectory.dir('generated/webassets/www'))
    exclude '**/.DS_Store'
}

tasks.named('preBuild') {
    dependsOn copyWebApp
}
